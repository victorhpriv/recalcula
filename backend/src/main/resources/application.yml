spring:
  application:
    name: saldo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saldo}
    username: ${DB_USER:saldo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  # SMTP (Amazon SES, Resend, Brevo...). Sem MAIL_HOST, os e-mails são apenas registrados no log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

app:
  zone-id: America/Sao_Paulo
  # URL pública do frontend, usada nos links dos e-mails
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:Recalcula <nao-responda@example.com>}
  jwt:
    # Base64 com no mínimo 32 bytes. Gere com: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    issuer: saldo
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  cookie:
    secure: ${COOKIE_SECURE:true}
  login:
    max-attempts: 5
    lock-duration: 15m

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
