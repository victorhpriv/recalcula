# Perfil de desenvolvimento local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
app:
  jwt:
    # Sem valor padrão: defina JWT_SECRET também em desenvolvimento (openssl rand -base64 48).
    secret: ${JWT_SECRET:}
  cookie:
    secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    br.com.saldo: DEBUG
