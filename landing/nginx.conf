server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~* \.(css|js|woff2|svg|png|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /index.html;
}
